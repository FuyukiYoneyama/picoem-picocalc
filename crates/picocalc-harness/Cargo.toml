[package]
name = "picocalc-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal harness crate for the PicoCalc firmware-conformance work
# (picocalc_emu Milestone 1). Path-only dep on `rp2040-emu`; not
# publishable in its current form.
publish = false
build = "build.rs"

[features]
default = []
# Diagnostic-only OPT0-A build. The normal conformance runner remains
# byte-for-byte schema compatible and carries no profiler hot-path branch.
idle-profiler = ["rp2040-emu/idle-profiler"]
# Diagnostic-only OPT2-B running event-horizon opportunity profiler.
# This deliberately includes the existing behavior observation machinery;
# its output is not valid for wall-time measurement.
event-horizon-profiler = ["idle-profiler", "behavior-trace", "rp2040-emu/event-horizon-profiler"]
# Diagnostic-only OPT0-B correctness build. Normal conformance and
# performance runners do not compile the streaming hash path.
behavior-trace = ["rp2040-emu/behavior-trace"]
# OPT4-A experimental decode-cache lookup. Not part of the default runner.
unconditional-cache-lookup-prototype = ["rp2040-emu/unconditional-cache-lookup-prototype"]

[lints]
workspace = true

[dependencies]
# Serial execution model only — the PicoCalc conformance track uses
# Serial as the correctness reference (see picocalc_emu
# docs/IMPLEMENTATION_PLAN.md §3.1). No `threading` feature.
rp2040-emu = { path = "../rp2040-emu" }
# Board models (ST7365P display, pin map, framebuffer/PNG, shared sha256).
picocalc-board = { path = "../picocalc-board" }
# Scenario files are JSON *input*. Reports stay hand-written so field
# order — and therefore the report bytes — is fixed by this crate rather
# than by a serialiser's map ordering. Parsed through `Value` rather than
# `derive`, so every error can name the JSON path that is wrong.
serde_json = { version = "1", default-features = false, features = ["std"] }

[[bin]]
name = "picocalc-run"
path = "src/main.rs"

[[bin]]
name = "opt0-idle-cost"
path = "src/bin/opt0_idle_cost.rs"
required-features = ["idle-profiler"]

[[bin]]
name = "opt0-blocked-baseline"
path = "src/bin/opt0_blocked_baseline.rs"
