[package]
name = "rp2040-emu"
version = "0.1.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cycle-accurate emulator for the Raspberry Pi RP2040 (dual Cortex-M0+ + PIO)."
repository = "https://github.com/FuyukiYoneyama/picoem-picocalc"
homepage = "https://github.com/FuyukiYoneyama/picoem-picocalc"
documentation = "https://docs.rs/rp2040-emu"
readme = "README.md"
keywords = ["emulator", "rp2040", "cortex-m0", "embedded", "pico"]
categories = ["emulators", "embedded"]

[lints]
workspace = true

[features]
# `threading` is opt-in for V1. The runtime supports x86_64 Windows
# and x86_64 Linux today (see the `cfg`-gates on
# `picoem_common::threaded` and `rp2040_emu::threaded::*`). On macOS or
# any non-x86_64 host the feature compiles but exposes no usable
# threaded entry points; defaulting it off keeps `cargo add rp2040-emu`
# working cross-platform out of the box. Windows / Linux users who
# want the threaded runtime should opt in: `cargo add rp2040-emu
# --features threading`.
default = []
# Forward the PIO `test-hooks` feature to `picoem-common`. Enables
# cross-crate unit tests to pop TX FIFO words via `PioBlock::pop_tx`
# and push RX FIFO words via `PioBlock::push_rx`.
test-hooks = ["picoem-common/test-hooks"]
# Dual-execution HLD V1 (Stage 3b.1): feature-gates the threaded
# runtime arriving in Stage 3b.2. Default on; disable for Serial-only
# builds on non-x86_64 targets. Stage 3b.1 ships the types only — the
# feature is a no-op until Stage 3b.2 lands the `threaded/` module.
threading = []
# Dual-execution HLD V1 (Stage 3b.1): opt-in surface for test-only
# panic-injection APIs arriving with Stage 3b.4. Mirrors the RP2350
# `testing` feature; NOT in `default` on purpose.
testing = []
# OPT0-A execution profiler. Kept out of default builds so the
# performance/reference path does not pay even a disabled runtime branch.
idle-profiler = []
# Diagnostic-only OPT2-B profiler.  It reuses the OPT0-A conservative
# horizon and OPT0-B observable-state snapshots, but normal execution does
# not compile any of its counters or MMIO classification hooks.
event-horizon-profiler = ["idle-profiler", "behavior-trace"]
# OPT0-B deterministic streaming event contract. Kept out of default
# builds so the performance path contains neither a disabled branch nor a
# hash state. The optional dependency exists only in diagnostic binaries.
behavior-trace = []
# OPT4-A experimental decode-cache lookup. The cache only accepts entries
# from cacheable executable regions, so production lookup can compare the
# full tag without repeating that region predicate. Kept opt-in until the
# current promoted baseline has a fresh exactness/performance record.
unconditional-cache-lookup-prototype = []
# OPT4-B experimental NVIC pending bitmap scan.  Kept opt-in until the
# promoted baseline has an exactness and performance record for the set-bit
# traversal; the default priority scan remains unchanged.
nvic-bitmap-scan-prototype = []
# OPT4-C experimental 8-byte decoded-op representation. The packed tag
# retains the full PC when combined with the direct-mapped slot; default
# layout remains the reference path until exactness/performance evidence is
# accepted.
decoded-op-8byte-prototype = []
# OPT4-D experimental compile-out of the ordinary instruction-boundary
# active-PC diagnostic store. Explicit diagnostic/exception paths retain
# `set_active_pc`; this feature is for trace/proof-off performance screening.
diagnostic-pc-compile-out-prototype = []
# OPT4-E experimental compact dispatch key in the default decoded-op flags.
# This cannot be combined with the OPT4-C packed 8-byte layout.
compact-dispatch-key-prototype = []
# P0-B application profiler. Diagnostic-only counters are compiled into the
# CPU core only when explicitly requested; normal builds have no hooks.
cpu-application-profiler = []

[dependencies]
picoem-common = { version = "0.2", path = "../picoem-common" }
picoem-devices = { version = "0.1", path = "../picoem-devices" }
tracing = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
picoem-common = { path = "../picoem-common", features = ["test-hooks"] }

# Dual-execution HLD V1 (Stage 3b.1): integration-test file registrations
# land now so later sub-stages can add tests without editing Cargo.toml.
# The files don't exist yet — Cargo only complains when the test is
# actually requested (`cargo test --test execution_model`).
[[test]]
name = "execution_model"
required-features = ["threading", "testing"]

[[test]]
name = "dual_model"
required-features = ["threading"]

# Coverage-driven smoke tests that drive `WorkerBus` peripheral paths
# under `ExecutionModel::Threaded`. Same `threading` requirement as
# `dual_model`; sibling file in `crates/rp2350-emu/tests/`.
[[test]]
name = "threaded_bus_paths"
required-features = ["threading"]

# docs.rs builds on Linux x86_64. Enable all opt-in features so the
# rendered API surface includes the threaded runtime (`x86_64`-Linux is
# one of the two supported platforms for `ThreadedEmulator`) plus the
# test-only hooks that integration tests reference.
[package.metadata.docs.rs]
features = ["threading", "testing", "test-hooks"]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
