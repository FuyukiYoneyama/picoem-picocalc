name: CI

# Quality gate for the PicoCalc backend (picocalc_emu work package R4).
#
# Three separate jobs on purpose. R4 requires that a failure identify the
# layer it came from, and one job running test-then-fmt-then-clippy would
# stop at the first failure and hide the rest.
#
# `ubuntu-24.04` is pinned rather than `ubuntu-latest`. Every reproducible
# artefact this backend is pinned against was built on Ubuntu 24.04's
# stock toolchain (arm-none-eabi-gcc 13.2.1, cmake 3.28.3, ninja 1.11.1),
# and `ubuntu-latest` moves to the next LTS without warning. A silent
# runner upgrade would break BIN reproduction while the gate stayed green.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The crates the PicoCalc conformance track actually runs on.
  #
  # rp2040-emu is included because picocalc-harness executes on it: a
  # regression in the core breaks the backend even though no PicoCalc file
  # changed. rp2350-emu and the silicon/QEMU oracles are deliberately out
  # of scope -- they target a different chip or need real hardware, and
  # they are not part of what picocalc_emu pins.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Test the PicoCalc board and runner crates
        run: cargo test -p picocalc-board -p picocalc-harness
      - name: Test the RP2040 core the backend runs on
        run: cargo test -p rp2040-emu
      - name: Build the runner picocalc_emu invokes
        # picocalc_emu's firmware regression shells out to
        # target/release/picocalc-run. A release build that fails should
        # be reported here, not as "backend unavailable" downstream.
        run: cargo build --release -p picocalc-harness

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - name: Check formatting of the crates this project owns
        # Scoped to the PicoCalc crates on purpose.
        #
        # This workspace is an independent derivative of 0x4D44/picoem and
        # most of it -- rp2350-emu, picoem-harness, the oracles -- is
        # inherited code carrying upstream's formatting. Running
        # `cargo fmt --all` would rewrite roughly a hundred sites in files
        # nobody here authored, producing a large diff of pure churn and
        # making future diffs against upstream harder to read.
        #
        # The same boundary the BSP draws between bsp/vendor (unmodified)
        # and bsp/src (ours), applied to the emulator workspace.
        run: cargo fmt -p picocalc-board -p picocalc-harness --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Lint the crates this project owns
        # Same scope and same reasoning as fmt. `-D warnings` is safe to
        # turn on here because these crates are already clean under it;
        # applying it workspace-wide would fail on inherited code.
        run: cargo clippy -p picocalc-board -p picocalc-harness --all-targets -- -D warnings
